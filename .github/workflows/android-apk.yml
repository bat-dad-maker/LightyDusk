# Builds the BOTWRecompAndroid EN release APK (arm64-v8a) on every push to main and on demand.
# No game files are involved: the app builds the game code on the phone from the user's own dump.
# The APK is signed with a key generated in the run (not a stable release key: uninstall before installing an APK
# signed with a different key).
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/publish-signed.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NDK_VERSION: 30.0.16248370
      HAS_STABLE_KEY: ${{ secrets.SIGNING_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" "cmake;3.30.4"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_LINUX=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Restore native dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            android/deps/out
            android/deps/src
          key: deps-${{ env.NDK_VERSION }}-${{ hashFiles('android/deps/*.sh', 'android/deps/*.patch') }}

      - name: Build native dependencies (SDL3, shaderc, headers)
        run: bash android/deps/build_deps.sh

      - name: Build FFmpeg
        run: bash android/deps/build_ffmpeg.sh

      - name: Build the on-device game code builder (Python, zig, unicorn, capstone, lz4)
        run: bash android/deps/build_gen_deps.sh

      - name: Save native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            android/deps/out
            android/deps/src
          key: deps-${{ env.NDK_VERSION }}-${{ hashFiles('android/deps/*.sh', 'android/deps/*.patch') }}

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          # A stable key from the repository secrets when they are set (APKs then update over each other); else a key
          # generated for this run only (uninstall the previous build before installing one signed with another key).
          mkdir -p ~/.botwrecompandroid
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.botwrecompandroid/release.jks
            PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"
          else
            PASS=botwenbuild; ALIAS=botwen
            keytool -genkeypair -v -keystore ~/.botwrecompandroid/release.jks -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=BOTWRecompAndroid EN"
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$HOME/.botwrecompandroid/release.jks" "$PASS" "$ALIAS" "$PASS" > ~/.botwrecompandroid/keystore.properties

      - name: Gradle assembleRelease
        working-directory: android/botwrecompandroid
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        id: apk
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' android/botwrecompandroid/app/build.gradle.kts | cut -d'"' -f2)
          mkdir -p out
          cp android/botwrecompandroid/app/build/outputs/apk/release/*.apk "out/BOTWRecompAndroid-EN-${VERSION}.apk"
          sha256sum out/*.apk | tee out/SHA256SUMS.txt
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: BOTWRecompAndroid-EN-${{ steps.apk.outputs.version }}
          path: out/*

      - name: Publish to the release
        # Only when the stable key is in the repository secrets. Otherwise the release keeps the APK signed with the
        # owner's stable key (published by publish-signed.yml), and this build stays a workflow artifact.
        if: env.HAS_STABLE_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.apk.outputs.version }}"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "BOTWRecompAndroid EN ${{ steps.apk.outputs.version }}" --notes-file docs/CHANGELOG.md --prerelease
          gh release upload "$TAG" out/*.apk out/SHA256SUMS.txt --clobber
